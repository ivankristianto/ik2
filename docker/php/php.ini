; ----- Runtime ----------------------------------------------------------
memory_limit = 256M
max_execution_time = 60
max_input_vars = 3000
; Upload stays below post (CVE-2026-109618 hardening; 8.5.12 is the real fix).
post_max_size = 32M
upload_max_filesize = 30M
expose_php = Off

; ----- Sessions ---------------------------------------------------------
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
; Blocks the stale-state RCE path (CVE-2026-109619); WordPress never uses it.
session.upload_progress.enabled = 0

; ----- Errors -----------------------------------------------------------
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
; Blocks the fatal-backtrace path of CVE-2026-109619 on PHP 8.5.
fatal_error_backtraces = 0

; ----- OPcache (production tuning; xdebug overrides in dev) ------------
opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.fast_shutdown = 1
; JIT off: tracing mode is the likely cause of a 4 GiB frame alloc in get_template() (2026-10-14), and WP gains little from it.
opcache.jit = disable
opcache.jit_buffer_size = 0

; ----- Realpath cache --------------------------------------------------
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; ----- Date ------------------------------------------------------------
date.timezone = UTC
