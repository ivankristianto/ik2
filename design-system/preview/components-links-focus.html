<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <p style="margin:0 0 14px;font-family:var(--font-sans);font-size:1.0625rem;line-height:1.7;color:#171717">An <a style="color:#C2410C;text-decoration:underline;text-decoration-thickness:0.08em;text-underline-offset:0.18em">inline article link</a> is always underlined. The <a style="color:#9A3412;text-decoration:underline;text-decoration-thickness:0.08em;text-underline-offset:0.18em">same link on hover</a> shifts to deep terracotta, underline thickness does not change.</p>
  <p style="margin:0 0 14px;font-family:var(--font-sans);font-size:1.0625rem;line-height:1.7;color:#171717">Nav links live <a style="color:#171717;text-decoration:none">without an underline</a> until you hover them, then they pick up terracotta.</p>
  <div style="display:flex;align-items:center;gap:14px;margin-top:10px">
    <a style="display:inline-flex;align-items:center;justify-content:center;min-height:2.5rem;padding-inline:14px;background:#fff;border:1px solid #D8D5CC;border-radius:6px;color:#171717;font-family:var(--font-sans);font-weight:600;font-size:0.9375rem;text-decoration:none;outline:2px solid #C2410C;outline-offset:3px">Focused button</a>
    <span style="font-family:var(--font-mono);font-size:11px;color:#5F6368">:focus-visible · 2px terracotta · 3px offset</span>
  </div>
</div>
</body></html>
