<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <p style="margin:0 0 14px;font-family:var(--font-sans);font-size:1.0625rem;line-height:1.7;color:#1C1D1B">An <a style="color:#2F5D50;text-decoration:underline;text-decoration-thickness:0.08em;text-underline-offset:0.18em">inline article link</a> is always underlined. The <a style="color:#234539;text-decoration:underline;text-decoration-thickness:0.08em;text-underline-offset:0.18em">same link on hover</a> shifts to deep bookcloth green, underline thickness does not change.</p>
  <p style="margin:0 0 14px;font-family:var(--font-sans);font-size:1.0625rem;line-height:1.7;color:#1C1D1B">Nav links live <a style="color:#1C1D1B;text-decoration:none">without an underline</a> until you hover them, then they pick up bookcloth green.</p>
  <div style="display:flex;align-items:center;gap:14px;margin-top:10px">
    <a style="display:inline-flex;align-items:center;justify-content:center;min-height:2.5rem;padding-inline:14px;background:#FFFFFF;border:1px solid #DCDCD5;border-radius:6px;color:#1C1D1B;font-family:var(--font-sans);font-weight:600;font-size:0.9375rem;text-decoration:none;outline:2px solid #2F5D50;outline-offset:3px">Focused button</a>
    <span style="font-family:var(--font-mono);font-size:11px;color:#494A46">:focus-visible · 2px bookcloth green · 3px offset</span>
  </div>
</div>
</body></html>
