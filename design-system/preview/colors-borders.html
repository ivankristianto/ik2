<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="row">
    <div class="swatch"><div class="swatch__chip" style="background:#DCDCD5"></div><span class="swatch__name">Line</span><span class="swatch__token">--color-border</span><span class="swatch__hex">#DCDCD5 · default 1px border</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:#B6B6AE"></div><span class="swatch__name">Rule</span><span class="swatch__token">--color-border-strong</span><span class="swatch__hex">#B6B6AE · dividers, active</span></div>
    <div class="swatch" style="flex:2">
      <div class="swatch__chip" style="background:#FFFFFF;border:1px solid #DCDCD5;display:flex;align-items:center;justify-content:center;color:#494A46;font-family:ui-monospace,monospace;font-size:12px">card · 1px Line</div>
      <div class="swatch__chip" style="background:#FFFFFF;border:1px solid #B6B6AE;display:flex;align-items:center;justify-content:center;color:#494A46;font-family:ui-monospace,monospace;font-size:12px">hover · 1px Rule</div>
    </div>
  </div>
</div>
</body></html>
