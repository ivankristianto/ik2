<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <p style="margin:0 0 16px;font-family:var(--font-sans);font-size:1.0625rem;line-height:1.75;color:#171717">Run <code style="font-family:var(--font-mono);font-size:0.9em;background:#EFEEE8;color:#111827;border:1px solid #D8D5CC;border-radius:4px;padding:0.125rem 0.35rem">npm install -g cloudflare-api</code> and then call <code style="font-family:var(--font-mono);font-size:0.9em;background:#EFEEE8;color:#111827;border:1px solid #D8D5CC;border-radius:4px;padding:0.125rem 0.35rem">cloudflare zone list</code> to see your active zones.</p>
  <p style="margin:0;font-family:var(--font-sans);font-size:1.0625rem;line-height:1.75;color:#171717">Toggle the theme with <kbd style="font-family:var(--font-mono);font-size:0.85em;background:#fff;color:#171717;border:1px solid #D8D5CC;border-bottom-width:2px;border-radius:4px;padding:0.05rem 0.4rem">⌘</kbd> <kbd style="font-family:var(--font-mono);font-size:0.85em;background:#fff;color:#171717;border:1px solid #D8D5CC;border-bottom-width:2px;border-radius:4px;padding:0.05rem 0.4rem">K</kbd>, then type <kbd style="font-family:var(--font-mono);font-size:0.85em;background:#fff;color:#171717;border:1px solid #D8D5CC;border-bottom-width:2px;border-radius:4px;padding:0.05rem 0.4rem">theme</kbd>.</p>
</div>
</body></html>
