<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card" style="background:#F1EFE8;padding:32px 24px">
  <div style="display:flex;gap:24px;align-items:flex-end">
    <div style="text-align:center;font-family:var(--font-mono);font-size:11px;color:#5F6368">
      <div style="width:160px;height:90px;background:#fff;border:1px solid #D8D5CC;border-radius:var(--radius-md);margin-bottom:12px;display:flex;align-items:center;justify-content:center;color:var(--color-text-subtle)">none</div>
      <div style="color:#171717;font-weight:600">no shadow</div><div>default state</div>
    </div>
    <div style="text-align:center;font-family:var(--font-mono);font-size:11px;color:#5F6368">
      <div style="width:160px;height:90px;background:#fff;border:1px solid #B9B5AA;border-radius:var(--radius-md);margin-bottom:12px;box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:center;color:var(--color-text-subtle)">card hover</div>
      <div style="color:#171717;font-weight:600">--shadow-sm</div><div>0 1px 2px / 0 1px 1px, 4% + 3% black</div>
    </div>
    <div style="text-align:center;font-family:var(--font-mono);font-size:11px;color:#5F6368">
      <div style="width:160px;height:90px;background:#fff;border:1px solid #D8D5CC;border-radius:var(--radius-md);margin-bottom:12px;box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;color:var(--color-text-subtle)">modal / palette</div>
      <div style="color:#171717;font-weight:600">--shadow-md</div><div>0 6px 24px rgba(0,0,0,.08)</div>
    </div>
  </div>
</div>
</body></html>
