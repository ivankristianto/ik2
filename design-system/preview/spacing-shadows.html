<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card" style="background:#F1EFE8;padding:32px 24px">
  <div style="display:flex;gap:24px;align-items:flex-end">
    <div style="text-align:center;font-family:var(--font-mono);font-size:11px;color:#5F6368">
      <div style="width:160px;height:90px;background:#fff;border:1px solid #D8D5CC;border-radius:8px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;color:#8A8F98">none</div>
      <div style="color:#171717;font-weight:600">--shadow-none</div><div>default state</div>
    </div>
    <div style="text-align:center;font-family:var(--font-mono);font-size:11px;color:#5F6368">
      <div style="width:160px;height:90px;background:#fff;border:1px solid #B9B5AA;border-radius:8px;margin-bottom:12px;box-shadow:0 1px 2px rgba(23,23,23,.06);display:flex;align-items:center;justify-content:center;color:#8A8F98">card hover</div>
      <div style="color:#171717;font-weight:600">--shadow-sm</div><div>0 1px 2px rgba(23,23,23,.06)</div>
    </div>
    <div style="text-align:center;font-family:var(--font-mono);font-size:11px;color:#5F6368">
      <div style="width:160px;height:90px;background:#fff;border:1px solid #D8D5CC;border-radius:8px;margin-bottom:12px;box-shadow:0 8px 24px rgba(23,23,23,.08);display:flex;align-items:center;justify-content:center;color:#8A8F98">modal / palette</div>
      <div style="color:#171717;font-weight:600">--shadow-md</div><div>0 8px 24px rgba(23,23,23,.08)</div>
    </div>
  </div>
</div>
</body></html>
