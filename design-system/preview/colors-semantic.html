<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="row" style="margin-bottom:14px">
    <div class="swatch"><div class="swatch__chip" style="background:#15803D"></div><span class="swatch__name">Build Green</span><span class="swatch__token">--color-success</span><span class="swatch__hex">#15803D · published, passing</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:#B45309"></div><span class="swatch__name">Amber</span><span class="swatch__token">--color-warning</span><span class="swatch__hex">#B45309 · outdated, draft</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:#B91C1C"></div><span class="swatch__name">Red</span><span class="swatch__token">--color-danger</span><span class="swatch__hex">#B91C1C · errors only</span></div>
  </div>
  <div style="display:flex;gap:8px;font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px">
    <span style="display:inline-flex;align-items:center;gap:6px;color:#15803D"><span style="width:8px;height:8px;border-radius:999px;background:#15803D"></span>● build passing</span>
    <span style="display:inline-flex;align-items:center;gap:6px;color:#B45309;margin-left:18px"><span style="width:8px;height:8px;border-radius:999px;background:#B45309"></span>● note from 2019, may be outdated</span>
    <span style="display:inline-flex;align-items:center;gap:6px;color:#B91C1C;margin-left:18px"><span style="width:8px;height:8px;border-radius:999px;background:#B91C1C"></span>● 404</span>
  </div>
</div>
</body></html>
