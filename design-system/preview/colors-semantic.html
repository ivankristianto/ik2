<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="row" style="margin-bottom:14px">
    <div class="swatch"><div class="swatch__chip" style="background:#2F5D50"></div><span class="swatch__name">Build Green</span><span class="swatch__token">--color-success</span><span class="swatch__hex">#2F5D50 · published, passing</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:#8A5A14"></div><span class="swatch__name">Amber</span><span class="swatch__token">--color-warning</span><span class="swatch__hex">#8A5A14 · outdated, draft</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:#A33A2A"></div><span class="swatch__name">Red</span><span class="swatch__token">--color-danger</span><span class="swatch__hex">#A33A2A · errors only</span></div>
  </div>
  <div style="display:flex;gap:8px;font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px">
    <span style="display:inline-flex;align-items:center;gap:6px;color:#2F5D50"><span style="width:8px;height:8px;border-radius:999px;background:#2F5D50"></span>● build passing</span>
    <span style="display:inline-flex;align-items:center;gap:6px;color:#8A5A14;margin-left:18px"><span style="width:8px;height:8px;border-radius:999px;background:#8A5A14"></span>● note from 2019, may be outdated</span>
    <span style="display:inline-flex;align-items:center;gap:6px;color:#A33A2A;margin-left:18px"><span style="width:8px;height:8px;border-radius:999px;background:#A33A2A"></span>● 404</span>
  </div>
</div>
</body></html>
