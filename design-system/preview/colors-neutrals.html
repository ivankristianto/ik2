<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="row">
    <div class="swatch"><div class="swatch__chip" style="background:#F8F7F3"></div><span class="swatch__name">Paper</span><span class="swatch__token">--color-bg</span><span class="swatch__hex">#F8F7F3</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:#FFFFFF"></div><span class="swatch__name">Surface</span><span class="swatch__token">--color-surface</span><span class="swatch__hex">#FFFFFF</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:#F1EFE8"></div><span class="swatch__name">Soft Paper</span><span class="swatch__token">--color-surface-muted</span><span class="swatch__hex">#F1EFE8</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:#171717"></div><span class="swatch__name">Ink</span><span class="swatch__token">--color-text</span><span class="swatch__hex">#171717</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:#5F6368"></div><span class="swatch__name">Graphite</span><span class="swatch__token">--color-text-muted</span><span class="swatch__hex">#5F6368</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:#8A8F98"></div><span class="swatch__name">Dust</span><span class="swatch__token">--color-text-subtle</span><span class="swatch__hex">#8A8F98</span></div>
  </div>
</div>
</body></html>
