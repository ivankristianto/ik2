<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="row">
    <div class="swatch"><div class="swatch__chip" style="background:#FCFCFA"></div><span class="swatch__name">Paper</span><span class="swatch__token">--color-bg</span><span class="swatch__hex">#FCFCFA</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:#FFFFFF"></div><span class="swatch__name">Surface</span><span class="swatch__token">--color-surface</span><span class="swatch__hex">#FFFFFF</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:#EFEFEB"></div><span class="swatch__name">Soft Paper</span><span class="swatch__token">--color-surface-muted</span><span class="swatch__hex">#EFEFEB</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:#1C1D1B"></div><span class="swatch__name">Ink</span><span class="swatch__token">--color-text</span><span class="swatch__hex">#1C1D1B</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:#494A46"></div><span class="swatch__name">Graphite</span><span class="swatch__token">--color-text-muted</span><span class="swatch__hex">#494A46</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:var(--color-text-subtle)"></div><span class="swatch__name">Dust</span><span class="swatch__token">--color-text-subtle</span><span class="swatch__hex">#5C5D58</span></div>
  </div>
</div>
</body></html>
