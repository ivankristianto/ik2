<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  .btn { display:inline-flex;align-items:center;justify-content:center;min-height:2.75rem;padding-inline:1rem;border-radius:0.375rem;font-family:var(--font-sans);font-weight:600;font-size:0.9375rem;line-height:1;text-decoration:none;border:1px solid;transition:background 160ms ease, border-color 160ms ease, color 160ms ease;cursor:pointer }
  .btn-primary { background:#171717;border-color:#171717;color:#F8F7F3 }
  .btn-primary--hover { background:#9A3412;border-color:#9A3412 }
  .btn-secondary { background:#fff;border-color:#D8D5CC;color:#171717 }
  .btn-secondary--hover { background:#F1EFE8;border-color:#B9B5AA }
  .btn-text { background:transparent;border:0;color:#C2410C;text-decoration:underline;text-decoration-thickness:0.08em;text-underline-offset:0.18em;padding:0;min-height:auto;font-weight:600 }
  .lbl { font-family:var(--font-mono);font-size:11px;color:#8A8F98;text-align:center;margin-top:8px }
  .col { display:flex;flex-direction:column;align-items:center }
</style>
</head>
<body>
<div class="card">
  <div style="display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start">
    <div class="col"><a class="btn btn-primary" href="#">Browse Guides</a><span class="lbl">primary · default</span></div>
    <div class="col"><a class="btn btn-primary btn-primary--hover" href="#">Browse Guides</a><span class="lbl">primary · hover</span></div>
    <div class="col"><a class="btn btn-secondary" href="#">Read Resume</a><span class="lbl">secondary · default</span></div>
    <div class="col"><a class="btn btn-secondary btn-secondary--hover" href="#">Read Resume</a><span class="lbl">secondary · hover</span></div>
    <div class="col"><a class="btn-text" href="#">Latest Articles →</a><span class="lbl">text link</span></div>
  </div>
  <div style="margin-top:18px;font-family:var(--font-mono);font-size:11px;color:#5F6368">One primary button per section. Order on hero: <b>Primary</b> · Secondary · text link.</div>
</div>
</body></html>
