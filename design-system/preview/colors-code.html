<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div class="row" style="margin-bottom:14px">
    <div class="swatch"><div class="swatch__chip" style="background:#F1F1ED"></div><span class="swatch__name">Code Paper</span><span class="swatch__token">--color-code-bg</span><span class="swatch__hex">#F1F1ED · code bg</span></div>
    <div class="swatch"><div class="swatch__chip" style="background:#1C1D1B"></div><span class="swatch__name">Code Ink</span><span class="swatch__token">--color-code-text</span><span class="swatch__hex">#1C1D1B · code text</span></div>
    <div class="swatch" style="flex:1.8">
      <div style="background:#F1F1ED;border:1px solid #DCDCD5;border-radius:var(--radius-md);padding:10px 12px;font-family:ui-monospace,SFMono-Regular,monospace;font-size:13px;color:#1C1D1B;line-height:1.55">
        <span style="color:#494A46">$ </span>npm install -g cloudflare-api<br>
        <span style="color:#494A46">$ </span>cloudflare zone list
      </div>
    </div>
  </div>
</div>
</body></html>
