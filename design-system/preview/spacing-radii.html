<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:flex;gap:16px;align-items:flex-end">
    <div style="text-align:center;font-family:var(--font-mono);font-size:11px;color:#5F6368">
      <div style="width:80px;height:80px;background:#fff;border:1px solid #D8D5CC;border-radius:var(--radius-sm);margin-bottom:8px"></div>
      <div style="color:#171717;font-weight:600">sm</div><div>4px · kbd, inline code</div>
    </div>
    <div style="text-align:center;font-family:var(--font-mono);font-size:11px;color:#5F6368">
      <div style="width:80px;height:80px;background:#fff;border:1px solid #D8D5CC;border-radius:var(--radius-md);margin-bottom:8px"></div>
      <div style="color:#171717;font-weight:600">md</div><div>6px · card, button, input</div>
    </div>
    <div style="text-align:center;font-family:var(--font-mono);font-size:11px;color:#5F6368">
      <div style="width:80px;height:80px;background:#fff;border:1px solid #D8D5CC;border-radius:var(--radius-lg);margin-bottom:8px"></div>
      <div style="color:#171717;font-weight:600">lg</div><div>8px · palette panel</div>
    </div>
    <div style="text-align:center;font-family:var(--font-mono);font-size:11px;color:#5F6368">
      <div style="width:80px;height:80px;background:#fff;border:1px solid #D8D5CC;border-radius:var(--radius-pill);margin-bottom:8px"></div>
      <div style="color:#171717;font-weight:600">pill</div><div>999px · tag</div>
    </div>
    <div style="text-align:center;font-family:var(--font-mono);font-size:11px;color:#5F6368">
      <div style="width:80px;height:80px;background:#fff;border:1px solid #D8D5CC;border-radius:var(--radius-round);margin-bottom:8px"></div>
      <div style="color:#171717;font-weight:600">round</div><div>50% · dot</div>
    </div>
  </div>
</div>
</body></html>
