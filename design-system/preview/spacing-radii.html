<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:flex;gap:16px;align-items:flex-end">
    <div style="text-align:center;font-family:var(--font-mono);font-size:11px;color:#5F6368">
      <div style="width:80px;height:80px;background:#fff;border:1px solid #D8D5CC;border-radius:0.25rem;margin-bottom:8px"></div>
      <div style="color:#171717;font-weight:600">xs</div><div>4px · inline code</div>
    </div>
    <div style="text-align:center;font-family:var(--font-mono);font-size:11px;color:#5F6368">
      <div style="width:80px;height:80px;background:#fff;border:1px solid #D8D5CC;border-radius:0.375rem;margin-bottom:8px"></div>
      <div style="color:#171717;font-weight:600">sm</div><div>6px · button, tag</div>
    </div>
    <div style="text-align:center;font-family:var(--font-mono);font-size:11px;color:#5F6368">
      <div style="width:80px;height:80px;background:#fff;border:1px solid #D8D5CC;border-radius:0.5rem;margin-bottom:8px"></div>
      <div style="color:#171717;font-weight:600">md</div><div>8px · card</div>
    </div>
    <div style="text-align:center;font-family:var(--font-mono);font-size:11px;color:#5F6368">
      <div style="width:80px;height:80px;background:#fff;border:1px solid #D8D5CC;border-radius:0.75rem;margin-bottom:8px"></div>
      <div style="color:#171717;font-weight:600">lg</div><div>12px · large panel</div>
    </div>
    <div style="text-align:center;font-family:var(--font-mono);font-size:11px;color:#5F6368">
      <div style="width:80px;height:80px;background:#fff;border:1px solid #D8D5CC;border-radius:999px;margin-bottom:8px"></div>
      <div style="color:#171717;font-weight:600">pill</div><div>999px · pill</div>
    </div>
  </div>
</div>
</body></html>
