<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
  /* Drawn at real token widths, zoomed to fit the 652px card. */
  .mock { zoom: calc(652 / 1280); }
  .mock__full { width: var(--width-full); height: 248px; padding: 16px 0; box-sizing: border-box; background: var(--color-surface-muted); border: 2px dashed var(--color-border-strong); border-radius: 8px; }
  .mock__wide { width: var(--width-wide); height: 100%; margin-inline: auto; padding: 12px 0; box-sizing: border-box; background: var(--color-surface); border: 2px solid var(--color-border); border-radius: 8px; }
  .mock__content { width: var(--width-content); height: 100%; margin-inline: auto; background: var(--color-accent-soft); border-radius: 8px; }
  .legend { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 14px; font-family: var(--font-mono); font-size: 11px; }
  .legend b { color: var(--color-text); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: middle; margin-right: 6px; border: 1px solid var(--color-border); }
</style>
</head>
<body>
<div class="card">
  <div class="mock">
    <div class="mock__full"><div class="mock__wide"><div class="mock__content"></div></div></div>
  </div>
  <div class="legend">
    <div><i style="background:var(--color-accent-soft);border-color:var(--color-accent)"></i><b>content</b> · <span data-token="--width-content"></span></div>
    <div><i style="background:var(--color-surface)"></i><b>wide</b> · <span data-token="--width-wide"></span></div>
    <div><i style="background:var(--color-surface-muted)"></i><b>full</b> · <span data-token="--width-full"></span></div>
  </div>
</div>
<script>
  const root = getComputedStyle( document.documentElement );
  for ( const el of document.querySelectorAll( '[data-token]' ) ) {
    el.textContent = root.getPropertyValue( el.dataset.token ).trim();
  }
</script>
</body></html>
