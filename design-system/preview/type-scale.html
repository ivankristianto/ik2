<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="display:grid;grid-template-columns:64px 1fr 110px;column-gap:18px;row-gap:10px;align-items:baseline;font-family:var(--font-sans)">
    <span style="font-family:var(--font-mono);font-size:11px;color:#8A8F98">4XL</span>
    <span style="font-size:2.75rem;font-weight:700;line-height:1.1;letter-spacing:-0.04em">Page title</span>
    <span style="font-family:var(--font-mono);font-size:11px;color:#5F6368;text-align:right">2.75rem · 44</span>

    <span style="font-family:var(--font-mono);font-size:11px;color:#8A8F98">3XL</span>
    <span style="font-size:2rem;font-weight:700;line-height:1.1;letter-spacing:-0.035em">Section heading</span>
    <span style="font-family:var(--font-mono);font-size:11px;color:#5F6368;text-align:right">2rem · 32</span>

    <span style="font-family:var(--font-mono);font-size:11px;color:#8A8F98">2XL</span>
    <span style="font-size:1.5rem;font-weight:700;line-height:1.2;letter-spacing:-0.025em">Card title</span>
    <span style="font-family:var(--font-mono);font-size:11px;color:#5F6368;text-align:right">1.5rem · 24</span>

    <span style="font-family:var(--font-mono);font-size:11px;color:#8A8F98">XL</span>
    <span style="font-size:1.25rem">Lead paragraph</span>
    <span style="font-family:var(--font-mono);font-size:11px;color:#5F6368;text-align:right">1.25rem · 20</span>

    <span style="font-family:var(--font-mono);font-size:11px;color:#8A8F98">LG</span>
    <span style="font-size:1.125rem">Body text</span>
    <span style="font-family:var(--font-mono);font-size:11px;color:#5F6368;text-align:right">1.125rem · 18</span>

    <span style="font-family:var(--font-mono);font-size:11px;color:#8A8F98">MD</span>
    <span style="font-size:1rem">UI text</span>
    <span style="font-family:var(--font-mono);font-size:11px;color:#5F6368;text-align:right">1rem · 16</span>

    <span style="font-family:var(--font-mono);font-size:11px;color:#8A8F98">SM</span>
    <span style="font-size:0.875rem;font-family:var(--font-mono);color:#5F6368">date · tag · reading-time</span>
    <span style="font-family:var(--font-mono);font-size:11px;color:#5F6368;text-align:right">0.875rem · 14</span>

    <span style="font-family:var(--font-mono);font-size:11px;color:#8A8F98">XS</span>
    <span style="font-size:0.75rem;font-family:var(--font-mono);color:#8A8F98">tiny metadata</span>
    <span style="font-family:var(--font-mono);font-size:11px;color:#5F6368;text-align:right">0.75rem · 12</span>
  </div>
</div>
</body></html>
