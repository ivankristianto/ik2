<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="position:relative;background:#EFEEE8;border:1px solid #D8D5CC;border-radius:8px;padding:20px 22px;font-family:var(--font-mono);font-size:14px;line-height:1.65;color:#111827">
    <button style="position:absolute;top:10px;right:10px;background:#fff;border:1px solid #D8D5CC;border-radius:6px;padding:4px 10px;font-family:var(--font-mono);font-size:12px;color:#5F6368;cursor:pointer">Copy</button>
<pre style="margin:0;background:none;border:0;padding:0;font:inherit;color:inherit"><span style="color:#5F6368"># Install the Cloudflare CLI</span>
$ npm install -g cloudflare-api

<span style="color:#5F6368"># Generate a token at dash.cloudflare.com/profile/api-tokens,</span>
<span style="color:#5F6368"># then save it once:</span>
$ cloudflare config --token &lt;your-token&gt;

<span style="color:#5F6368"># Purge cache for a zone</span>
$ cloudflare zone purge ivankristianto.com</pre>
  </div>
</div>
</body></html>
