<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
<div class="card">
  <div style="position:relative;background:#F1F1ED;border:1px solid #DCDCD5;border-radius:var(--radius-md);padding:20px 22px;font-family:var(--font-mono);font-size:14px;line-height:1.65;color:#1C1D1B">
    <button style="position:absolute;top:10px;right:10px;background:#FFFFFF;border:1px solid #DCDCD5;border-radius:6px;padding:4px 10px;font-family:var(--font-mono);font-size:12px;color:#494A46;cursor:pointer">Copy</button>
<pre style="margin:0;background:none;border:0;padding:0;font:inherit;color:inherit"><span style="color:#494A46"># Install the Cloudflare CLI</span>
$ npm install -g cloudflare-api

<span style="color:#494A46"># Generate a token at dash.cloudflare.com/profile/api-tokens,</span>
<span style="color:#494A46"># then save it once:</span>
$ cloudflare config --token &lt;your-token&gt;

<span style="color:#494A46"># Purge cache for a zone</span>
$ cloudflare zone purge ivankristianto.com</pre>
  </div>
</div>
</body></html>
