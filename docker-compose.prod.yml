# Reference compose file for Dokploy.
# Set environment variables in the Dokploy UI; do not commit secrets here.
#
# Dokploy can either:
#   1. Reference this file directly from the repo (compose deployment), or
#   2. Use the two images independently as separate services.

name: ik2org-prod

services:
    uploads-init:
        image: busybox:1.36
        command: ["sh", "-c", "mkdir -p /uploads && chown -R 82:82 /uploads"]
        volumes:
            - uploads:/uploads
        restart: "no"

    app:
        image: ghcr.io/ivankristianto/ik2-app:latest
        pull_policy: always
        networks:
            - dokploy-network
        environment:
            WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
            WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
            WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
            WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
            WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
            # Object cache (wp-redis): redis://user:pass@host:port/db, parsed by
            # the baked wp-config-redis.php. Unset → wp-redis degrades gracefully.
            REDIS_SERVER: ${REDIS_SERVER:-}
            WORDPRESS_CONFIG_EXTRA: |
                define('WP_HOME', '${WP_HOME}');
                define('WP_SITEURL', '${WP_SITEURL}');
                define('DISALLOW_FILE_EDIT', true);
                define('DISALLOW_FILE_MODS', true);
                define('FORCE_SSL_ADMIN', true);
                if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
                    $$_SERVER['HTTPS'] = 'on';
                }
            # WordPress reads the WORDPRESS_-prefixed names (via
            # wp-config-docker.php); bare AUTH_KEY etc. were silently ignored.
            WORDPRESS_AUTH_KEY: ${WORDPRESS_AUTH_KEY}
            WORDPRESS_SECURE_AUTH_KEY: ${WORDPRESS_SECURE_AUTH_KEY}
            WORDPRESS_LOGGED_IN_KEY: ${WORDPRESS_LOGGED_IN_KEY}
            WORDPRESS_NONCE_KEY: ${WORDPRESS_NONCE_KEY}
            WORDPRESS_AUTH_SALT: ${WORDPRESS_AUTH_SALT}
            WORDPRESS_SECURE_AUTH_SALT: ${WORDPRESS_SECURE_AUTH_SALT}
            WORDPRESS_LOGGED_IN_SALT: ${WORDPRESS_LOGGED_IN_SALT}
            WORDPRESS_NONCE_SALT: ${WORDPRESS_NONCE_SALT}
        # Mount uploads under the baked webroot /var/www/app (NOT /var/www/html,
        # which is an unused anonymous volume inherited from the wordpress base
        # image — code baked there would be shadowed by a stale volume snapshot
        # on every redeploy).
        volumes:
            - uploads:/var/www/app/wp-content/uploads
        depends_on:
            uploads-init:
                condition: service_completed_successfully
        restart: unless-stopped

    nginx:
        image: ghcr.io/ivankristianto/ik2-nginx:latest
        pull_policy: always
        networks:
            - dokploy-network
        volumes:
            - uploads:/var/www/app/wp-content/uploads:ro
        depends_on:
            - app
        restart: unless-stopped

    wp-cli:
        # Dedicated wp-cli image (Dockerfile `cli` target): the lean
        # wordpress:cli runtime with the same WordPress core, theme/plugins,
        # mu-plugins, vendor, and baked wp-config.php (reads creds from env)
        # copied in, so it can bootstrap WordPress without reusing the php-fpm
        # app image.
        image: ghcr.io/ivankristianto/ik2-cli:latest
        pull_policy: always
        # Runs as www-data (uid 82). The webroot is baked at the non-volume path
        # /var/www/app (WORKDIR), so `docker compose exec wp-cli wp ...` runs this
        # deploy's code without --allow-root and without any startup file copy.
        user: "82:82"
        networks:
            - dokploy-network
        environment:
            WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
            WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
            WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
            WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
            WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
            # Same Redis as the app so wp-cli cache writes/flushes hit the
            # real backend (the cli image ships PhpRedis).
            REDIS_SERVER: ${REDIS_SERVER:-}
        # Mount uploads under the baked webroot (NOT /var/www/html, which is an
        # unused anonymous volume inherited from the wordpress:cli base image).
        volumes:
            - uploads:/var/www/app/wp-content/uploads
        depends_on:
            uploads-init:
                condition: service_completed_successfully
            app:
                condition: service_started
        # Keep the container alive for `docker compose exec`. The inherited
        # wordpress:cli entrypoint execs this verbatim (it is not a wp subcommand).
        command: ["tail", "-f", "/dev/null"]
        tty: true
        stdin_open: true
        restart: unless-stopped

networks:
    # Dokploy's shared network. The Dokploy-managed MySQL service
    # (e.g. ik2-db-a3zfgl) lives here; services must join it to resolve
    # the DB host. Verify the name on the host: `docker network ls`.
    dokploy-network:
        external: true

volumes:
    uploads:
