# Reference compose file for Dokploy.
# Set environment variables in the Dokploy UI; do not commit secrets here.
#
# Dokploy can either:
#   1. Reference this file directly from the repo (compose deployment), or
#   2. Use the two images independently as separate services.

name: ik2org-prod

services:
    uploads-init:
        image: busybox:1.36
        command: ["sh", "-c", "mkdir -p /uploads && chown -R 82:82 /uploads"]
        volumes:
            - uploads:/uploads
        restart: "no"

    app:
        image: ghcr.io/ivankristianto/ik2-app:latest
        environment:
            WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
            WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
            WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
            WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
            WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
            WORDPRESS_CONFIG_EXTRA: |
                define('WP_HOME', '${WP_HOME}');
                define('WP_SITEURL', '${WP_SITEURL}');
                define('DISALLOW_FILE_EDIT', true);
                define('DISALLOW_FILE_MODS', true);
                define('FORCE_SSL_ADMIN', true);
                define('WP_DEBUG', false);
                if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
                    $$_SERVER['HTTPS'] = 'on';
                }
            # WordPress reads the WORDPRESS_-prefixed names (via
            # wp-config-docker.php); bare AUTH_KEY etc. were silently ignored.
            WORDPRESS_AUTH_KEY: ${WORDPRESS_AUTH_KEY}
            WORDPRESS_SECURE_AUTH_KEY: ${WORDPRESS_SECURE_AUTH_KEY}
            WORDPRESS_LOGGED_IN_KEY: ${WORDPRESS_LOGGED_IN_KEY}
            WORDPRESS_NONCE_KEY: ${WORDPRESS_NONCE_KEY}
            WORDPRESS_AUTH_SALT: ${WORDPRESS_AUTH_SALT}
            WORDPRESS_SECURE_AUTH_SALT: ${WORDPRESS_SECURE_AUTH_SALT}
            WORDPRESS_LOGGED_IN_SALT: ${WORDPRESS_LOGGED_IN_SALT}
            WORDPRESS_NONCE_SALT: ${WORDPRESS_NONCE_SALT}
        volumes:
            - uploads:/var/www/html/wp-content/uploads
        depends_on:
            uploads-init:
                condition: service_completed_successfully
        restart: unless-stopped

    nginx:
        image: ghcr.io/ivankristianto/ik2-nginx:latest
        volumes:
            - uploads:/var/www/html/wp-content/uploads:ro
        depends_on:
            - app
        restart: unless-stopped

    wp-cli:
        # Runs the app image so it has identical WordPress core, theme/plugins,
        # vendor, and the baked wp-config.php (which reads creds from env). The
        # generic wordpress:cli image has `wp` but no install, so it cannot
        # bootstrap WordPress. No shared code volume — stays fresh per deploy.
        image: ghcr.io/ivankristianto/ik2-app:latest
        pull_policy: always
        user: "82:82"
        environment:
            WORDPRESS_DB_HOST: ${WORDPRESS_DB_HOST}
            WORDPRESS_DB_USER: ${WORDPRESS_DB_USER}
            WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
            WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME}
            WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
        volumes:
            - uploads:/var/www/html/wp-content/uploads
        depends_on:
            uploads-init:
                condition: service_completed_successfully
            app:
                condition: service_started
        entrypoint: ["sh", "-c"]
        command: ["tail -f /dev/null"]
        tty: true
        stdin_open: true
        restart: unless-stopped

volumes:
    uploads:
