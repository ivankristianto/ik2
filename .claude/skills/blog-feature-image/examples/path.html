<!doctype html>

<html><head><meta charset="utf-8"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="card.css"><style>

.punch { position: absolute; left: 64px; top: 58px; width: 960px; font-size: 56px; }

.note { position: absolute; top: 424px; width: 230px; text-align: center; font-family: var(--font-mono); font-size: 18px; color: var(--graphite); white-space: nowrap; }
.note.no { color: var(--red); }
.note.ok { color: var(--signal); }
