name: ik2org

services:
    uploads-init:
        image: busybox:1.36
        command: ['sh', '-c', 'mkdir -p /uploads && chown -R 82:82 /uploads']
        volumes:
            - uploads:/uploads
        restart: 'no'

    app:
        build:
            context: .
            target: development
            args:
                INSTALL_XDEBUG: ${INSTALL_XDEBUG:-true}
        environment:
            WORDPRESS_DB_HOST: db
            WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
            WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
            WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
            WORDPRESS_DEBUG: 1
            WORDPRESS_CONFIG_EXTRA: |
                define('WP_HOME',    'http://localhost:8080');
                define('WP_SITEURL', 'http://localhost:8080');
                define('WP_DEBUG_LOG', true);
                define('WP_DEBUG_DISPLAY', false);
                define('SCRIPT_DEBUG', true);
                define('DISABLE_WP_CRON', true);
                define('WP_DEVELOPMENT_MODE', 'theme');
            REDIS_SERVER: redis://redis:6379/0
            # Env var, not a wp-config define — wp-config.php is baked into
            # the wp-html volume on first boot, so a define added later would
            # never land; wp_get_environment_type() reads the env var first.
            WP_ENVIRONMENT_TYPE: development
            XDEBUG_MODE: ${XDEBUG_MODE:-off}
        # The webroot is baked at /var/www/app (NOT /var/www/html, which is an
        # unused anonymous volume inherited from the wordpress base image).
        volumes:
            - wp-html:/var/www/app
            - ./wp-content/themes:/var/www/app/wp-content/themes
            - ./wp-content/plugins:/var/www/app/wp-content/plugins
            - ./wp-content/mu-plugins:/var/www/app/wp-content/mu-plugins
            - ./vendor:/var/www/app/vendor
            - uploads:/var/www/app/wp-content/uploads
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
            uploads-init:
                condition: service_completed_successfully
        restart: unless-stopped

    nginx:
        image: nginx:1.27-alpine
        ports:
            - '8080:80'
        volumes:
            - wp-html:/var/www/app:ro
            - ./wp-content/themes:/var/www/app/wp-content/themes:ro
            - ./wp-content/plugins:/var/www/app/wp-content/plugins:ro
            - ./wp-content/mu-plugins:/var/www/app/wp-content/mu-plugins:ro
            - ./vendor:/var/www/app/vendor:ro
            - uploads:/var/www/app/wp-content/uploads:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        restart: unless-stopped

    # Object cache backend for wp-redis. No persistence volume on purpose —
    # it's a cache; a restart just starts cold.
    redis:
        image: redis:7-alpine
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 3s
            retries: 6
        restart: unless-stopped

    db:
        image: mariadb:11
        environment:
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
            MARIADB_DATABASE: ${WORDPRESS_DB_NAME:-wordpress}
            MARIADB_USER: ${WORDPRESS_DB_USER:-wordpress}
            MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
        volumes:
            - db-data:/var/lib/mysql
        ports:
            - '3306:3306'
        healthcheck:
            test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
            interval: 10s
            timeout: 5s
            retries: 6
        restart: unless-stopped

    # Persistent wp-cli container — stays running so `composer dev:wp` can
    # `docker compose exec` into it for an interactive shell with `wp` on PATH.
    wp-cli:
        # Built from this repo's `cli` target (not the stock wordpress:cli
        # image) so it ships PhpRedis — cache writes/flushes from wp-cli hit
        # the same Redis the web container reads, instead of a per-process
        # fallback cache that would leave the web serving stale values.
        build:
            context: .
            target: cli
        user: '82:82'
        environment:
            WORDPRESS_DB_HOST: db
            WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
            WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
            WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
            REDIS_SERVER: redis://redis:6379/0
            WP_ENVIRONMENT_TYPE: development
        # The base image's WORKDIR is /var/www/html (its volume path); point it
        # at the shared webroot instead so `wp` finds the install.
        working_dir: /var/www/app
        volumes:
            - wp-html:/var/www/app
            - ./wp-content/themes:/var/www/app/wp-content/themes
            - ./wp-content/plugins:/var/www/app/wp-content/plugins
            - ./wp-content/mu-plugins:/var/www/app/wp-content/mu-plugins
            - ./vendor:/var/www/app/vendor
            - uploads:/var/www/app/wp-content/uploads
        depends_on:
            db:
                condition: service_healthy
            uploads-init:
                condition: service_completed_successfully
            app:
                condition: service_started
        entrypoint: ['sh', '-c']
        command: ['tail -f /dev/null']
        tty: true
        stdin_open: true
        restart: unless-stopped

    composer:
        image: composer:2
        working_dir: /app
        volumes:
            - .:/app
            - composer-cache:/tmp/cache
        profiles: ['tools']

    pnpm:
        image: node:24-alpine
        working_dir: /app
        volumes:
            - .:/app
            - pnpm-store:/root/.local/share/pnpm/store
        environment:
            COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        entrypoint:
            [
                'sh',
                '-c',
                'corepack enable >/dev/null 2>&1; exec pnpm "$$@"',
                '_',
            ]
        profiles: ['tools']

volumes:
    wp-html:
    db-data:
    uploads:
    composer-cache:
    pnpm-store:
