name: ik2org

services:
    uploads-init:
        image: busybox:1.36
        command: ['sh', '-c', 'mkdir -p /uploads && chown -R 82:82 /uploads']
        volumes:
            - uploads:/uploads
        restart: 'no'

    app:
        build:
            context: .
            target: development
            args:
                INSTALL_XDEBUG: ${INSTALL_XDEBUG:-true}
        environment:
            WORDPRESS_DB_HOST: db
            WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
            WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
            WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
            WORDPRESS_DEBUG: 1
            WORDPRESS_CONFIG_EXTRA: |
                define('WP_HOME',    'http://localhost:8080');
                define('WP_SITEURL', 'http://localhost:8080');
                define('WP_DEBUG_LOG', true);
                define('WP_DEBUG_DISPLAY', false);
                define('SCRIPT_DEBUG', true);
                define('DISABLE_WP_CRON', true);
                define('WP_DEVELOPMENT_MODE', 'theme');
            XDEBUG_MODE: ${XDEBUG_MODE:-off}
        volumes:
            - wp-html:/var/www/html
            - ./wp-content/themes:/var/www/html/wp-content/themes
            - ./wp-content/plugins:/var/www/html/wp-content/plugins
            - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
            - ./vendor:/var/www/html/vendor
            - uploads:/var/www/html/wp-content/uploads
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        depends_on:
            db:
                condition: service_healthy
            uploads-init:
                condition: service_completed_successfully
        restart: unless-stopped

    nginx:
        image: nginx:1.27-alpine
        ports:
            - '8080:80'
        volumes:
            - wp-html:/var/www/html:ro
            - ./wp-content/themes:/var/www/html/wp-content/themes:ro
            - ./wp-content/plugins:/var/www/html/wp-content/plugins:ro
            - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
            - ./vendor:/var/www/html/vendor:ro
            - uploads:/var/www/html/wp-content/uploads:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        restart: unless-stopped

    db:
        image: mariadb:11
        environment:
            MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
            MARIADB_DATABASE: ${WORDPRESS_DB_NAME:-wordpress}
            MARIADB_USER: ${WORDPRESS_DB_USER:-wordpress}
            MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
        volumes:
            - db-data:/var/lib/mysql
        ports:
            - '3306:3306'
        healthcheck:
            test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
            interval: 10s
            timeout: 5s
            retries: 6
        restart: unless-stopped

    # Persistent wp-cli container — stays running so `composer dev:wp` can
    # `docker compose exec` into it for an interactive shell with `wp` on PATH.
    wp-cli:
        image: wordpress:cli-php8.5
        user: '82:82'
        environment:
            WORDPRESS_DB_HOST: db
            WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
            WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
            WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
        volumes:
            - wp-html:/var/www/html
            - ./wp-content/themes:/var/www/html/wp-content/themes
            - ./wp-content/plugins:/var/www/html/wp-content/plugins
            - ./wp-content/mu-plugins:/var/www/html/wp-content/mu-plugins
            - ./vendor:/var/www/html/vendor
            - uploads:/var/www/html/wp-content/uploads
        depends_on:
            db:
                condition: service_healthy
            uploads-init:
                condition: service_completed_successfully
            app:
                condition: service_started
        entrypoint: ['sh', '-c']
        command: ['tail -f /dev/null']
        tty: true
        stdin_open: true
        restart: unless-stopped

    composer:
        image: composer:2
        working_dir: /app
        volumes:
            - .:/app
            - composer-cache:/tmp/cache
        profiles: ['tools']

    pnpm:
        image: node:24-alpine
        working_dir: /app
        volumes:
            - .:/app
            - pnpm-store:/root/.local/share/pnpm/store
        environment:
            COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        entrypoint:
            [
                'sh',
                '-c',
                'corepack enable >/dev/null 2>&1; exec pnpm "$$@"',
                '_',
            ]
        profiles: ['tools']

volumes:
    wp-html:
    db-data:
    uploads:
    composer-cache:
    pnpm-store:
