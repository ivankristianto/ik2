name: Quality

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

# Only PR runs share a group. A cancelled or replaced push run on main would leave
# its commit range unscanned by the secrets job, since the next run starts after it.
concurrency:
    group: quality-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
    cancel-in-progress: true

# The release commit only bumps package.json, and release.mjs already required
# Quality to pass on its parent, so linting it again is wasted time.
jobs:
    php:
        name: PHP (PHPCS + PHPStan + PHPUnit)
        if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  tools: composer:v2, cs2pr
                  coverage: none

            - name: Cache composer
              uses: actions/cache@v4
              with:
                  path: |
                      vendor
                      ~/.composer/cache
                  key: composer-${{ runner.os }}-${{ hashFiles('composer.lock', 'composer.json') }}
                  restore-keys: composer-${{ runner.os }}-

            - name: Install composer dependencies
              run: composer install --prefer-dist --no-progress --no-interaction

            - name: PHPUnit
              run: composer test

            - name: PHPCS — WordPress Coding Standards
              run: composer lint -- --report=checkstyle -q | cs2pr

            - name: PHPStan — static analysis
              run: composer analyse -- --error-format=github

    js:
        name: JS + CSS (ESLint + Stylelint)
        if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up pnpm
              uses: pnpm/action-setup@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: pnpm

            - name: Install JS dependencies
              run: pnpm install --frozen-lockfile

            - name: ESLint
              run: pnpm lint:js

            - name: Stylelint
              run: pnpm lint:css

            - name: Design tokens in sync with theme.json
              run: pnpm tokens:check

    # Its own package and lockfile, outside the root pnpm workspace.
    embedder:
        name: Embedder (node --test)
        if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: services/embedder
        steps:
            - uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: npm
                  cache-dependency-path: services/embedder/package-lock.json

            - name: Install embedder dependencies
              run: npm ci

            - name: node --test
              run: npm test

    # No release-commit skip: every pushed range gets scanned. See docs/secret-scanning.md.
    secrets:
        name: Secrets (Betterleaks)
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: '24'

            - name: Install pinned Betterleaks
              run: scripts/secret-scan.sh install

            - name: Secret scan self-test
              run: node --test tests/secret-scan.test.mjs

            - name: Scan this event's commits
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  FROM_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
                  TO_SHA: ${{ github.event.pull_request.head.sha || github.event.after }}
              run: scripts/secret-scan.sh ci "$EVENT_NAME" "$FROM_SHA" "$TO_SHA"
