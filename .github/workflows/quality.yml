name: Quality

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

concurrency:
    group: quality-${{ github.ref }}
    cancel-in-progress: true

# The release commit only bumps package.json, and release.mjs already required
# Quality to pass on its parent, so linting it again is wasted time.
jobs:
    php:
        name: PHP (PHPCS + PHPStan)
        if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  tools: composer:v2, cs2pr
                  coverage: none

            - name: Cache composer
              uses: actions/cache@v4
              with:
                  path: |
                      vendor
                      ~/.composer/cache
                  key: composer-${{ runner.os }}-${{ hashFiles('composer.lock', 'composer.json') }}
                  restore-keys: composer-${{ runner.os }}-

            - name: Install composer dependencies
              run: composer install --prefer-dist --no-progress --no-interaction

            - name: PHPCS — WordPress Coding Standards
              run: composer lint -- --report=checkstyle -q | cs2pr

            - name: PHPStan — static analysis
              run: composer analyse -- --error-format=github

    js:
        name: JS + CSS (ESLint + Stylelint)
        if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up pnpm
              uses: pnpm/action-setup@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: pnpm

            - name: Install JS dependencies
              run: pnpm install --frozen-lockfile

            - name: ESLint
              run: pnpm lint:js

            - name: Stylelint
              run: pnpm lint:css

            - name: Design tokens in sync with theme.json
              run: pnpm tokens:check
