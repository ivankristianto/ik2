name: Build & push images

on:
    push:
        branches: [main]
        tags: ['v*']
    pull_request:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: true

env:
    REGISTRY: ghcr.io
    APP_IMAGE: ${{ github.repository }}-app
    NGINX_IMAGE: ${{ github.repository }}-nginx

jobs:
    app:
        name: app (php-fpm)
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        outputs:
            tag: ${{ steps.meta.outputs.version }}
            digest: ${{ steps.push.outputs.digest }}
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.APP_IMAGE }}
                  tags: |
                      type=ref,event=branch
                      type=ref,event=pr
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=sha,format=long
                      type=raw,value=latest,enable={{is_default_branch}}

            - id: push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  target: production
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=app
                  cache-to: type=gha,mode=max,scope=app
                  platforms: linux/amd64

    nginx:
        name: nginx
        runs-on: ubuntu-latest
        needs: app
        if: github.event_name != 'pull_request'
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4

            - uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.NGINX_IMAGE }}
                  tags: |
                      type=ref,event=branch
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=sha,format=long
                      type=raw,value=latest,enable={{is_default_branch}}

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  file: docker/nginx/Dockerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      APP_IMAGE=${{ env.REGISTRY }}/${{ env.APP_IMAGE }}@${{ needs.app.outputs.digest }}
                  cache-from: type=gha,scope=nginx
                  cache-to: type=gha,mode=max,scope=nginx
                  platforms: linux/amd64

    deploy:
        name: Notify Dokploy
        runs-on: ubuntu-latest
        needs: [app, nginx]
        if: github.ref == 'refs/heads/main'
        steps:
            - name: Trigger Dokploy webhook
              env:
                  DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
              run: |
                  if [ -n "$DOKPLOY_WEBHOOK_URL" ]; then
                    curl -fsSL -X POST "$DOKPLOY_WEBHOOK_URL"
                  else
                    echo "DOKPLOY_WEBHOOK_URL not set — skipping notify."
                  fi
